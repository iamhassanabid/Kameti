<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kameti Dashboard</title>
  <style>
    /* Warm Beige Palette */
    :root {
      --bg-color: #f3edd9;         /* Cream Background */
      --card-bg: #faf7ed;       /* Light Cream Card */
      --card-border: #e2d9be;   /* Border Tone */
      --text-dark: #1b263b;     /* Navy Dark Text */
      --title-red: #8c3227;     /* Reddish-Brown Title */
      --box-bg: #e8dcc4;       /* Sand Box Background */
      --input-bg: #ffffff;      /* White Input Background */
      --navy-btn: #1a2536;      /* Dark Navy Accent */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Password Screen Styling */
    .password-container {
      max-width: 400px;
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      text-align: center;
    }

    .password-title {
      color: var(--title-red);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .password-input {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid #c7beaa;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      color: var(--text-dark);
      outline: none;
      margin-bottom: 15px;
      text-align: center;
    }

    .password-btn {
      width: 100%;
      background-color: var(--navy-btn);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .password-btn:hover {
      background-color: #0f172a;
    }

    .error-msg {
      color: #d9534f;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    /* Main Dashboard Styling (Initially Hidden) */
    .dashboard-container {
      display: none;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 35px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    /* Top Title */
    .dashboard-title {
      color: var(--title-red);
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 25px;
      letter-spacing: -0.3px;
    }

    /* Top Metrics Bar */
    .metrics-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: var(--box-bg);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      text-align: center;
    }

    .metric-item {
      flex: 1;
    }

    .metric-divider {
      width: 1px;
      height: 35px;
      background-color: #c7beaa;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 5px;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-dark);
    }

    /* Input Controls Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 30px;
      margin-bottom: 30px;
    }

    .control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .control-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
      white-space: nowrap;
    }

    .control-input {
      width: 55%;
      background-color: var(--input-bg);
      border: 1px solid #c7beaa;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
      outline: none;
      transition: border 0.2s;
    }

    .control-input:focus {
      border-color: var(--navy-btn);
    }

    /* Draw Schedule Table */
    .table-section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--title-red);
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
    }

    th {
      background-color: var(--navy-btn);
      color: #ffffff;
      padding: 12px 15px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 12px 15px;
      border-bottom: 1px solid var(--card-border);
      background-color: #fcfaf3;
      font-size: 14px;
      font-weight: 500;
    }

    tr:nth-child(even) td {
      background-color: #f5f0e1;
    }

    @media (max-width: 650px) {
      .controls-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      .metrics-bar {
        flex-direction: column;
        gap: 15px;
      }
      .metric-divider {
        width: 80%;
        height: 1px;
      }
    }
  </style>
</head>
<body>

  <!-- Password Screen -->
  <div class="password-container" id="passwordBox">
    <div class="password-title">Enter Password</div>
    <input type="password" id="passInput" class="password-input" placeholder="Password daalein" onkeypress="handlePassKey(event)">
    <button class="password-btn" onclick="checkPassword()">Access Dashboard</button>
    <div class="error-msg" id="errorMsg">Incorrect Password! Dobara try karein.</div>
  </div>

  <!-- Dashboard Content -->
  <div class="dashboard-container" id="dashboardContent">
    <div class="dashboard-title">Kameti Calculator Dashboard</div>

    <!-- Top Metrics -->
    <div class="metrics-bar">
      <div class="metric-item">
        <div class="metric-label">Collection / Draw</div>
        <div class="metric-value" id="collectionDraw">PKR 200,000</div>
      </div>
      <div class="metric-divider"></div>
      <div class="metric-item">
        <div class="metric-label">Total Rounds</div>
        <div class="metric-value" id="totalRounds">20</div>
      </div>
      <div class="metric-divider"></div>
      <div class="metric-item">
        <div class="metric-label">Total Cycle Volume</div>
        <div class="metric-value" id="cycleVolume">PKR 4,000,000</div>
      </div>
    </div>

    <!-- Control Inputs Grid -->
    <div class="controls-grid">
      <div class="control-group">
        <label class="control-label">Total Members</label>
        <input type="number" id="members" value="20" class="control-input" oninput="calculate()">
      </div>

      <div class="control-group">
        <label class="control-label">Installment (Rs)</label>
        <input type="number" id="installment" value="10000" class="control-input" oninput="calculate()">
      </div>

      <div class="control-group">
        <label class="control-label">Draw Frequency</label>
        <select id="frequency" class="control-input" onchange="calculate()">
          <option value="1">Monthly</option>
          <option value="0.5">Bi-Monthly (Maheene mein 2)</option>
          <option value="0.33">10 Days Cycle</option>
          <option value="0.03">Daily</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Winners Per Draw</label>
        <input type="number" id="winners" value="1" min="1" class="control-input" oninput="calculate()">
      </div>
    </div>

    <!-- Breakdown Table -->
    <div class="table-section-title">Schedule Summary</div>
    <table>
      <thead>
        <tr>
          <th>Round #</th>
          <th>Time Period</th>
          <th>Pool Amount</th>
        </tr>
      </thead>
      <tbody id="scheduleBody">
      </tbody>
    </table>
  </div>

  <script>
    // Password Logic
    function checkPassword() {
      const inputPass = document.getElementById('passInput').value;
      const errorMsg = document.getElementById('errorMsg');
      
      if (inputPass === "Ahbab") {
        document.getElementById('passwordBox').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';
        calculate();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    function handlePassKey(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    }

    // Calculation Logic
    function calculate() {
      const members = parseInt(document.getElementById('members').value) || 0;
      const installment = parseFloat(document.getElementById('installment').value) || 0;
      const winners = parseInt(document.getElementById('winners').value) || 1;
      const frequency = parseFloat(document.getElementById('frequency').value) || 1;

      // Backend Calculations
      const collectionPerDraw = members * installment;
      const rounds = members > 0 ? Math.ceil(members / winners) : 0;
      const totalVolume = collectionPerDraw * rounds;

      // Display Top Metrics
      document.getElementById('collectionDraw').innerText = `PKR ${collectionPerDraw.toLocaleString()}`;
      document.getElementById('totalRounds').innerText = rounds;
      document.getElementById('cycleVolume').innerText = `PKR ${totalVolume.toLocaleString()}`;

      // Populate Table
      const tbody = document.getElementById('scheduleBody');
      tbody.innerHTML = '';

      if (rounds === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Enter valid member details</td></tr>';
        return;
      }

      for (let i = 1; i <= Math.min(rounds, 20); i++) {
        const timeVal = (i * frequency).toFixed(1).replace('.0', '');
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>Round ${i}</td>
          <td>Month ${timeVal}</td>
          <td>PKR ${collectionPerDraw.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      }

      if (rounds > 20) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="3" style="text-align:center; font-style:italic;">...and ${rounds - 20} more rounds</td>`;
        tbody.appendChild(tr);
      }
    }
  </script>
</body>
</html>
